[project]
name = "haus"
version = "0.1.0"
description = "Private household management application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"alembic>=1.14,<2.0",
	"authlib>=1.3,<2.0",
	"fastapi>=0.115,<1.0",
	"itsdangerous>=2.2,<3.0",
	"jinja2>=3.1,<4.0",
	"pydantic-settings>=2.6,<3.0",
	"python-multipart>=0.0.9,<1.0",
	"reportlab>=4.2,<5.0",
	"sqlalchemy>=2.0,<3.0",
	"uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
	"httpx>=0.27,<1.0",
	"pytest>=8.0,<9.0",
]

[project.scripts]
haus = "app.main:run"
haus-admin = "app.admin:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["app"]
