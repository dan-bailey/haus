services:
  app:
    build: .
    restart: unless-stopped
    environment:
      HAUS_DATABASE_URL: sqlite:////data/haus.db
      HAUS_MEDIA_DIR: /data/media
      HAUS_APP_HOST: 0.0.0.0
      HAUS_SESSION_SECRET: ${HAUS_SESSION_SECRET:?set HAUS_SESSION_SECRET}
      HAUS_GOOGLE_CLIENT_ID: ${HAUS_GOOGLE_CLIENT_ID:?set HAUS_GOOGLE_CLIENT_ID}
      HAUS_GOOGLE_CLIENT_SECRET: ${HAUS_GOOGLE_CLIENT_SECRET:?set HAUS_GOOGLE_CLIENT_SECRET}
    volumes:
      - haus-data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  haus-data:
  caddy-data:
  caddy-config: