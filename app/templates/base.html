<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Haus{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --haus-ink: #20343a; --haus-sage: #dce8df; --haus-cream: #fbfaf5; }
    body { background: var(--haus-cream); color: var(--haus-ink); }
    .haus-header { background: var(--haus-ink); color: white; }
    .day-card { min-height: 12rem; border: 1px solid #d8e0db; }
    .day-card.today { border-color: #d07a4b; box-shadow: 0 0 0 2px #f2d2bd; }
    .feral { background: #f3e5d8; }
    .status { font-size: .75rem; letter-spacing: .04em; text-transform: uppercase; }
  </style>
</head>
<body>
  <header class="haus-header py-3 mb-4">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="text-white text-decoration-none fw-semibold" href="/meals/calendar?week_start={{ week_start }}">Haus</a>
      <a class="btn btn-sm btn-light" href="/meals/shopping-list?week_start={{ week_start }}">Shopping PDF</a>
    </div>
  </header>
  <main class="container pb-5">{% block content %}{% endblock %}</main>
</body>
</html>
